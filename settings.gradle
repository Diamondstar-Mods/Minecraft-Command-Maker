pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'LegacyFabric'
            url = 'https://repo.legacyfabric.net/maven/'
        }
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Minecraft-Command-Maker'

// Multi-version server builds
//include 'server-1.17'              // MC 1.17.x
//include 'server-1.18-1.19-1.20'   // MC 1.18-1.20.x
include 'server-1.21'              // MC 1.21.x
include 'server-1.21-paper'        // MC 1.21.x Paper/Bukkit/Spigot
include 'server-1.21-forge-neoforge' // MC 1.21.x Forge/NeoForge
include 'server-1.22'              // MC 26.1

include 'client'
include 'client-legacy'           // MC 1.8-1.13.2 Legacy Fabric Client
include 'server-legacy'           // MC 1.8-1.13.2 Legacy Fabric Server
include 'server-litloader'        // MC 1.12.2 LiteLoader
include 'server-nilloader'        // MC 1.12.2 NilLoader
include 'server-ornithe'          // MC 1.8.9 Ornithe
include 'server-rift'              // MC 1.21.x RiftLoader

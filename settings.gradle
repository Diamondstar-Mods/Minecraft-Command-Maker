pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'LegacyFabric'
            url = 'https://repo.legacyfabric.net/maven/'
        }
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'Minecraft-Command-Maker'

// Multi-version server builds
//include 'server-1.17'              // MC 1.17.x
//include 'server-1.18-1.19-1.20'   // MC 1.18-1.20.x
include 'server-1.21'              // MC 1.21.x
include 'server-1.22'              // MC 26.1

//include 'client'

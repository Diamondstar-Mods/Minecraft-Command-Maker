pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'LegacyFabric'
            url = 'https://repo.legacyfabric.net/maven/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'Minecraft-Command-Maker'

// Multi-version server builds
// NOTE: Uncomment older versions once source code is adapted for those MC APIs
// include 'server-1.17'           // MC 1.17.x — needs code adaptation (pre-v2 commands, pre-DrawContext, pre-Identifier.of)
// include 'server-1.18-1.19-1.20' // MC 1.18-1.20.x — needs code adaptation (pre-DataComponentTypes, pre-Identifier.of)
include 'server-1.21'              // MC 1.21.x — current active build
// include 'server-1.22'           // MC 26.1 — build requires Java 25 JDK installed

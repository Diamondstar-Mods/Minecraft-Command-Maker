pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'LegacyFabric'
            url = 'https://repo.legacyfabric.net/maven/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'Minecraft-Command-Maker'

// Multi-version server builds
// include 'server-1.17'           // MC 1.17.x — needs source adaptation
include 'server-1.18-1.19-1.20' // MC 1.18-1.20.x — source adapted
include 'server-1.21'              // MC 1.21.x
include 'server-1.22'              // MC 26.1 — JDK 25 from PrismLauncher

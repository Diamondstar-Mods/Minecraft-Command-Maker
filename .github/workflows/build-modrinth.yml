name: "Build and Publish"
on:
    push

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Build with Gradle
        id: build
        run: chmod +x gradlew && ./gradlew build

      - name: Find correct JAR
        id: findjar
        run: |
          output="build/libs/CMDMakerFabric.jar"
          echo "jarname=$output" >> $GITHUB_OUTPUT


      - name: Upload to Modrinth
        uses: RubixDev/modrinth-upload@v1
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          file_path: build/libs/CMDMakerFabric.jar
          name: Command Maker Nightly ${{ github.run_number }} (Fabric)
          version: Nightly-${{ github.run_number }}
          changelog: ${{ github.event.release.body }}
          relations: P7dR8mSH:required
          game_versions: 1.20,1.20.1,1.20.2,1.20.3,1.20.4,1.20.5,1.20.6,1.21,1.21.1,1.21.2,1.21.3,1.21.4,1.21.5,1.21.6,1.21.7,1.21.8,1.21.9,1.21.10,1.21.11,26.1-snapshot-1
          release_type: alpha
          loaders: fabric
          featured: true
          project_id: 3cwbW4UB
name: Build Servers

on:
  push:
    branches: [ "3.x-fabric-1.22" ]
  pull_request:
    branches: [ "3.x-fabric-1.22" ]
  workflow_dispatch:

jobs:

  # ════════════════════════════════════════════════
  # Stage 1 — Primary build (gates all downstream)
  # ════════════════════════════════════════════════
  build-121:
    name: "▶ server-1.21"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build :server-1.21
        run: ./gradlew :server-1.21:build


  # ════════════════════════════════════════════════
  # Stage 2 — Parallel branches (all depend on 1.21)
  # ════════════════════════════════════════════════

  # Branch A
  build-122:
    name: "  └─ server-1.22"
    runs-on: ubuntu-latest
    needs: build-121
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build :server-1.22
        run: ./gradlew :server-1.22:build


  # Branch B
  build-forge-neoforge:
    name: "  ├─ server-1.21-forge-neoforge"
    runs-on: ubuntu-latest
    needs: build-121
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build :server-1.21-forge-neoforge
        run: ./gradlew :server-1.21-forge-neoforge:build


  # Branch C
  build-paper:
    name: "  ├─ server-1.21-paper (Paper/Folia/Purpur/Sponge)"
    runs-on: ubuntu-latest
    needs: build-121
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build :server-1.21-paper
        run: ./gradlew :server-1.21-paper:build


  # Branch D
  build-client:
    name: "  ├─ client"
    runs-on: ubuntu-latest
    needs: build-121
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build :client
        run: ./gradlew :client:build


  # Branch E
  build-rift:
    name: "  └─ server-rift (RiftLoader)"
    runs-on: ubuntu-latest
    needs: build-121
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build :server-rift
        run: ./gradlew :server-rift:build

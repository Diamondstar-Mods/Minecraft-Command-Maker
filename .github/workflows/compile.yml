name: Build Servers

on:
  push:
    branches: [ "3.x-fabric-1.22" ]
  workflow_dispatch:

jobs:

  build-121:
    name: Build server-1.21
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build :server-1.21
        run: ./gradlew :server-1.21:build


  # ────────────────────────────────────────────────
  # Branch A: server-1.22 (runs after 1.21)
  # ────────────────────────────────────────────────
  build-122:
    name: Build server-1.22
    runs-on: ubuntu-latest
    needs: build-121
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build :server-1.22
        run: ./gradlew :server-1.22:build
    
  build-client:
    name: Build Client
    runs-on: ubuntu-latest
    needs: build-121
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build :client
        run: ./gradlew :client:build


  # ────────────────────────────────────────────────
  # Branch B: server-1.17 (runs after 1.21)
  # ────────────────────────────────────────────────
  build-117:
    name: Build server-1.17
    runs-on: ubuntu-latest
    needs: build-121
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build :server-1.17
        run: ./gradlew :server-1.17:build


  # ────────────────────────────────────────────────
  # server-1.18-1.19-1.20 (runs ONLY if 1.17 succeeds)
  # ────────────────────────────────────────────────
  build-118-119-120:
    name: Build server-1.18-1.19-1.20
    runs-on: ubuntu-latest
    needs: build-117
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build :server-1.18-1.19-1.20
        run: ./gradlew :server-1.18-1.19-1.20:build

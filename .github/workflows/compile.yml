name: Build All Servers

on:
  workflow_dispatch:
  push:
    branches: *
  pull_request:

jobs:

  build-121:
    name: Build server-1.21
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build :server-1.21
        run: ./gradlew :server-1.21:build

  build-122:
    name: Build server-1.22
    runs-on: ubuntu-latest
    needs: build-121
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build :server-1.22
        run: ./gradlew :server-1.22:build

  build-117:
    name: Build server-1.17
    runs-on: ubuntu-latest
    needs: build-122
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build :server-1.17
        run: ./gradlew :server-1.17:build

  build-118-119-120:
    name: Build server-1.18-1.19-1.20
    runs-on: ubuntu-latest
    needs: build-117
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build :server-1.18-1.19-1.20
        run: ./gradlew :server-1.18-1.19-1.20:build

name: "Build and Publish"
on:
    push

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Build with Gradle
        id: build
        run: chmod +x gradlew && ./gradlew build

      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
      - name: Find correct JAR
        id: findjar
        run: output="build/libs/CMDMaker-Fabric-latest.jar"



      - name: Upload to Modrinth
        uses: RubixDev/modrinth-upload@v1
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          file_path: build/libs/CMDMaker-Fabric-latest.jar
          name: Command Maker Nightly ${{ github.run_number }} (Fabric)
          version: Nightly-${{ github.run_number }}
          changelog: ${{ github.event.head_commit.message }}
          relations: P7dR8mSH:required
          game_versions: 26.1-snapshot-1
          release_type: alpha
          loaders: fabric
          featured: true
          project_id: 3cwbW4UB
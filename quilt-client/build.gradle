plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
description = "Compatible with Quilt. Supports Minecraft 1.21.9. Client-only version."
group = 'io.github.diamondstar_mods'

base {
    archivesName = project.archives_base_name + "-quilt-client"
}

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.quiltmc.org/repository/release' }
}

sourceSets {
    main {
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

loom {
    mods {
        "modid" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Minecraft and mappings
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

    // Quilt Loader
    modImplementation "org.quiltmc:quilt-loader:${project.quilt_loader_version}"

    // ASM library required by Quilt
    modImplementation "org.ow2.asm:asm:9.6"
    modImplementation "org.ow2.asm:asm-tree:9.6"
    modImplementation "org.ow2.asm:asm-analysis:9.6"
    modImplementation "org.ow2.asm:asm-commons:9.6"
    modImplementation "org.ow2.asm:asm-util:9.6"
    modImplementation "net.fabricmc:sponge-mixin:0.12.5+mixin.0.8.5"
    modImplementation "org.quiltmc:json5:1.0.0"

    // Use Fabric API (Quilt can load Fabric mods)
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Optional: JSON parsing
    implementation "com.google.code.gson:gson:2.10.1"
}

configurations.modImplementation {
    exclude group: 'net.fabricmc', module: 'fabric-loader'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties["version"]
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "CMDMakerFabric" }
    }
}
plugins {
    id 'fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
description = "NilLoader server mod for Minecraft 1.6-1.13.2."
group = 'io.github.diamondstar_mods'

base { archivesName = project.archives_base_name + "-server-nilloader" }

repositories {
    mavenCentral()
    maven { url 'https://repo.legacyfabric.net/maven/' }
}

dependencies {
    minecraft "com.mojang:minecraft:1.13.2"
    mappings "net.legacyfabric:yarn:1.13.2+build.458:v2"
    modImplementation "net.fabricmc:fabric-loader:0.18.4"
    implementation "com.google.code.gson:gson:2.10.1"
}

processResources { filesMatching("fabric.mod.json") { expand "version": project.version } }
tasks.withType(JavaCompile).configureEach { it.options.release = 8 }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_1_8; targetCompatibility = JavaVersion.VERSION_1_8 }

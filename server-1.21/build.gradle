plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
description = "Compatible with Fabric. Supports Minecraft 1.21.9."
group = 'io.github.diamondstar_mods' // <-- update this to match your GitHub org/user

base {
    archivesName = project.archives_base_name + "-server"
}

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://api.modrinth.com/maven' }
}

sourceSets {
    main {
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

loom {
    mods {
        "nekkycommandmaker" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Minecraft and mappings
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

    // Fabric Loader and API
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"



    // Optional: JSON parsing
    implementation "com.google.code.gson:gson:2.10.1"
    
    // LuckPerms API - optional, mod will work without it
    compileOnly "net.luckperms:api:5.4"

    // Placeholder API - optional, mod will work without it
    modCompileOnly "maven.modrinth:placeholder-api:2.5.2+1.21.3"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties["version"]
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "CMDMakerFabric" }
    }
}
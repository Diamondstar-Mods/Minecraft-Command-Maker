plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

allprojects {
    apply plugin: 'fabric-loom'
    apply plugin: 'maven-publish'

    version = project.mod_version
    group = 'io.github.diamondstar_mods'

    repositories {
        mavenCentral()
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.quiltmc.org/repository/release' }
        maven { url 'https://maven.quiltmc.org/repository/snapshot' }
    }

    dependencies {
        // Minecraft and mappings
        minecraft "com.mojang:minecraft:${project.minecraft_version}"
        mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

        // Fabric Loader and API (for all modules)
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

        // Optional: JSON parsing
        implementation "com.google.code.gson:gson:2.10.1"
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 17
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_25
    }
}

subprojects {
    tasks.withType(JavaCompile).configureEach {
        it.options.release = 17
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    loom {
        mods {
            "modid" {
                sourceSet sourceSets.main
            }
        }
    }

    processResources {
        inputs.property "version", project.version
        filesMatching("fabric.mod.json") {
            expand "version": inputs.properties["version"]
        }
    }

    jar {
        from("LICENSE") {
            rename { "CMDMakerFabric" }
        }
    }

    publishing {
        publications {
            create("mavenJava", MavenPublication) {
                artifactId = project.archives_base_name + (project.name == 'client' ? '-client' : '-server')
                from components.java
            }
        }
        repositories {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/${System.getenv('GITHUB_REPOSITORY')}")
                credentials {
                    username = System.getenv("USERNAME")
                    password = System.getenv("TOKEN")
                }
            }
        }
    }
}

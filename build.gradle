// Root aggregator build for multi-project (fabric + forge)

plugins {
    id 'base'
}

// Configure common repositories and Java for all subprojects
subprojects {
    repositories {
        mavenCentral()
    }

    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
}

// Root-level tasks to build both subprojects
tasks.register('assembleAll') {
    group = 'build'
    description = 'Assemble fabric and forge builds'
    dependsOn(':fabric:build')
    dependsOn(':forge:build')
}

// Make the default build run both
tasks.named('build') {
    dependsOn(tasks.named('assembleAll'))
}

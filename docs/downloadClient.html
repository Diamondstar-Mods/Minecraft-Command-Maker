<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Downloads - Command Maker Wiki</title>
    <meta name="description" content="Download legacy client versions of Command Maker for Minecraft. Browse available versions from the GitHub CDN.">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.ico">
    <style>
        .modal {
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: #fefefe;
            padding: 20px;
            border: 1px solid #888;
            border-radius: 5px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .modal-content button {
            margin: 10px;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border-radius: 3px;
        }
        .modal-content button:hover {
            background-color: #0056b3;
        }
        body.dark .modal-content {
            background-color: #333;
            color: #fff;
        }
        body.dark .modal-content button {
            background-color: #555;
            color: #fff;
        }
        body.dark .modal-content button:hover {
            background-color: #777;
        }
        .edition-selector {
            margin-bottom: 20px;
            text-align: center;
        }
        .edition-selector label {
            font-weight: bold;
            margin-right: 10px;
        }
        .edition-selector select {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            background-color: #fff;
            color: #333;
        }
        body.dark .edition-selector select {
            background-color: #333;
            color: #fff;
            border-color: #555;
        }
    </style>
</head>
<body class="download-page">
    <nav id="navbar" class="navbar" role="navigation" aria-label="Main navigation"></nav>
    <div class="layout">
        <aside id="sidebar" class="sidebar" role="complementary" aria-label="Side navigation"></aside>
        <main class="content" role="main">
            <h1>Legacy Client Downloads for Command Maker</h1>
            <p>Download client versions of Command Maker from our CDN. Choose between Client Edition or Server Edition for each version.</p>

            <div id="versions">Loading&hellip;</div>

            <div id="pagination">
                <button id="prevBtn">Previous</button>
                <span id="pageInfo">Page 1 of 1</span>
                <button id="nextBtn">Next</button>
            </div>
        </main>
    </div>

    <div id="error-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <p style="color: black;">Error loading versions. Please try again later.</p>
            <button id="retry-btn">Retry</button>
        </div>
    </div>

    <footer id="footer" class="footer" role="contentinfo"></footer>
    <script src="js/components.js"></script>
    <script src="js/script.js"></script>
    <script>
        let versions = [];
        let currentPage = 1;
        let totalPages = 1;
        const itemsPerPage = 5;

        function formatFileSize(bytes) {
            if (typeof bytes !== "number" || bytes <= 0) return "Unknown size";
            const units = ["B", "KB", "MB", "GB"];
            let i = 0;
            while (bytes >= 1024 && i < units.length - 1) {
                bytes /= 1024;
                i++;
            }
            return `${bytes.toFixed(bytes < 10 && i > 0 ? 1 : 0)} ${units[i]}`;
        }

        async function loadVersions() {
            const container = document.getElementById("versions");
            try {
                const response = await fetch("https://api.github.com/repos/Diamondstar-Mods/Minecraft-Command-Maker/contents/docs/cdn/versions/");
                const data = await response.json();
                versions = data
                    .filter((item) => item.type === "dir")
                    .map((item) => ({ name: item.name, path: item.path }));
                versions.sort((a, b) =>
                    b.name.localeCompare(a.name, undefined, {
                        numeric: true,
                        sensitivity: "base",
                    })
                ); // Sort descending
                totalPages = Math.max(1, Math.ceil(versions.length / itemsPerPage));
                currentPage = 1;
                await displayPage(1);
                updatePagination();
            } catch (err) {
                container.innerHTML = "Failed to load versions. Please check the console for details.";
                document.getElementById("error-modal").style.display = "flex";
                console.error(err);
            }
        }

        async function displayPage(page) {
            const container = document.getElementById("versions");
            container.innerHTML = "";
            const start = (page - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageVersions = versions.slice(start, end);

            for (const v of pageVersions) {
                const div = document.createElement("div");
                div.className = "version";

                div.innerHTML = `
                    <h2>Version ${v.name}</h2>
                    <div class="edition-selector">
                        <label for="edition-${v.name}">Select Edition:</label>
                        <select id="edition-${v.name}" class="edition-select">
                            <option value="client" selected>Client Edition</option>
                            <option value="server">Server Edition</option>
                        </select>
                    </div>
                    <div class="download-group">
                        <a id="download-link-${v.name}" class="download-btn" href="cdn/versions/${v.name}/client.jar" download>Download Client Edition</a>
                    </div>
                `;

                container.appendChild(div);

                // Add event listener to update download link
                document
                    .getElementById(`edition-${v.name}`)
                    .addEventListener("change", (event) => {
                        const selectedEdition = event.target.value;
                        const link = document.getElementById(`download-link-${v.name}`);
                        link.href = `cdn/versions/${v.name}/${selectedEdition}.jar`;
                        link.textContent = `Download ${selectedEdition.charAt(0).toUpperCase() + selectedEdition.slice(1)} Edition`;
                    });
            }
        }

        function updatePagination() {
            const prevBtn = document.getElementById("prevBtn");
            const nextBtn = document.getElementById("nextBtn");
            const pageInfo = document.getElementById("pageInfo");
            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage === totalPages;
            pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
        }

        document.getElementById("prevBtn").addEventListener("click", async () => {
            if (currentPage > 1) {
                currentPage--;
                await displayPage(currentPage);
                updatePagination();
            }
        });

        document.getElementById("nextBtn").addEventListener("click", async () => {
            if (currentPage < totalPages) {
                currentPage++;
                await displayPage(currentPage);
                updatePagination();
            }
        });

        loadVersions();

        document.getElementById("retry-btn").addEventListener("click", () => {
            document.getElementById("error-modal").style.display = "none";
            loadVersions();
        });
    </script>
</body>
</html>

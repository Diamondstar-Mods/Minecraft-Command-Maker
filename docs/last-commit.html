<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GitHub File Last Commit Date</title>
<style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #commit-date { font-weight: bold; color: #2c3e50; }
</style>
</head>
<body>

<p>File: <span id="file-path"></span></p>
<p>Last Commit Date: <span id="commit-date">Loading...</span></p>

<script>
// ====== CONFIGURATION ======
const owner = "diamondstar-mods";
const repo = "minecraft-command-maker";
const branch = "26.1";

// ====== READ SUBPATH FROM PARENT PAGE ======
let subPath = "";

// Only works if embedded in an iframe
try {
    const parentHeader = window.parent.document.getElementById("docs-path");
    if (parentHeader) {
        subPath = parentHeader.getAttribute("data-subpath") || "";
    }
} catch (e) {
    console.warn("Not embedded or cross-origin restrictions.");
}

// Final file path inside the repo
const filePath = "docs/" + subPath;

// Display file path
document.getElementById("file-path").textContent = filePath;

// GitHub API endpoint
const apiUrl = `https://api.github.com/repos/${owner}/${repo}/commits?path=${encodeURIComponent(filePath)}&sha=${branch}&per_page=1`;

fetch(apiUrl)
    .then(r => r.json())
    .then(data => {
        if (!data.length) {
            document.getElementById("commit-date").textContent = "No commits found.";
            return;
        }
        const commitDate = new Date(data[0].commit.committer.date);
        document.getElementById("commit-date").textContent = commitDate.toLocaleString();
    })
    .catch(err => {
        console.error(err);
        document.getElementById("commit-date").textContent = "Error fetching commit date.";
    });
</script>

</body>
</html>

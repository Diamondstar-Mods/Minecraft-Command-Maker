<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last Commit</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 13px;
            color: #64748b;
            padding: 4px 0;
            line-height: 1.4;
            background: transparent;
        }
        a { color: #2563eb; }
        .error { color: #dc2626; }
    </style>
</head>
<body>
    <span id="output">Loading...</span>

    <script>
        (function () {
            const owner = "Diamondstar-Mods";
            const repo = "Minecraft-Command-Maker";
            const branch = "3.x-fabric-1.22";

            const params = new URLSearchParams(window.location.search);
            const path = params.get("path");
            const filePath = path ? "docs/" + path : "docs/index.html";

            const apiUrl = "https://api.github.com/repos/" + owner + "/" + repo
                + "/commits?path=" + encodeURIComponent(filePath)
                + "&sha=" + branch + "&per_page=1";

            fetch(apiUrl)
                .then(function (r) {
                    if (!r.ok) throw new Error("GitHub API: " + r.status);
                    return r.json();
                })
                .then(function (data) {
                    if (!data.length) {
                        document.getElementById("output").textContent = "No commits found.";
                        return;
                    }
                    var c = data[0].commit;
                    var d = new Date(c.committer.date);
                    var author = (data[0].author && data[0].author.login) || c.committer.name || "Unknown";
                    document.getElementById("output").innerHTML =
                        "Last edited " + d.toLocaleString("en-GB") + " by <strong>" + author + "</strong>";
                })
                .catch(function (err) {
                    console.error(err);
                    document.getElementById("output").innerHTML =
                        '<span class="error">Could not load commit info.</span>';
                });
        })();
    </script>
</body>
</html>

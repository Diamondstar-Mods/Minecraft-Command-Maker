plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
description = "Command Maker — RiftLoader edition (MC >=1.14.1)"
group = 'io.github.diamondstar_mods'

base {
    archivesName = project.archives_base_name + "-Rift"
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

    compileOnly 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation 'com.google.code.gson:gson:2.10.1'
}

loom {
    mods {
        "cmdmaker-rift" {
            sourceSet sourceSets.main
        }
    }
    mixin {
        defaultRefmapName = "riftmod-refmap.json"
    }
}

processResources {
    filesMatching("riftmod.json") {
        expand "version": project.version
    }
    filesMatching("riftmod.mixins.json") {
        // No expansion needed
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

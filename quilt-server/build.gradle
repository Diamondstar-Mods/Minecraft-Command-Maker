plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
description = "Compatible with Quilt. Supports Minecraft 26.1. Server-only version."
group = 'io.github.diamondstar_mods'

base {
    archivesName = project.archives_base_name + "-server"
}

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.quiltmc.org/repository/release' }
}

sourceSets {
    main {
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

loom {
    mods {
        "modid" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Minecraft and mappings
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

    // Use Fabric API (Quilt can load Fabric mods)
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Provide Fabric loader API at compile time only (Quilt provides loader at runtime)
    compileOnly "net.fabricmc:fabric-loader:${project.loader_version}"

    // Optional: JSON parsing
    implementation "com.google.code.gson:gson:2.10.1"
}

configurations.modImplementation {
    exclude group: 'net.fabricmc', module: 'fabric-loader'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties["version"]
    }
    filesMatching("quilt.mod.json") {
        expand "version": inputs.properties["version"],
               "quilt_loader_version": project.quilt_loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("LICENSE") {
        rename { "CMDMakerQuilt" }
    }
}
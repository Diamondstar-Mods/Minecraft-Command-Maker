plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
description = "Fabric build of the mod"
group = 'io.github.diamondstar_mods'

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

sourceSets {
    main {
        // Keep using the top-level src directory for now to avoid moving files.
        java {
            srcDirs = ['../src/main/java']
        }
        resources {
            srcDirs = ['../src/main/resources']
        }
    }
}

loom {
    mods {
        "modid" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Minecraft and mappings
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

    // Fabric Loader and API
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Optional: JSON parsing
    implementation "com.google.code.gson:gson:2.10.1"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties["version"]
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
    archiveBaseName.set(project.archives_base_name)
    archiveVersion.set(project.version.toString())
    archiveClassifier.set('FABRIC')
}

tasks.register('fabricJar', Jar) {
    archiveBaseName.set(project.archives_base_name)
    archiveVersion.set(project.version.toString())
    archiveClassifier.set('FABRIC')
    // Ensure the FABRIC jar filename and output directory are in the root build/libs
    archiveFileName.set("${project.archives_base_name}-${project.version}-FABRIC.jar")
    destinationDirectory.set(rootProject.layout.buildDirectory.dir('libs'))
    from(sourceSets.main.output)
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
    dependsOn(tasks.named('classes'))
}

// Ensure fabric subproject `assemble` produces the fabricJar (and places it in root build/libs)
tasks.named('assemble') {
    dependsOn(tasks.named('fabricJar'))
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
